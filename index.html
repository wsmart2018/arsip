<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jasa Digitalisasi Arsip</title>
  <link rel="icon" href="https://wsmart2018.github.io/arsip/logoad.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
<iframe src="https://gamma.app/embed/5mdncke5iokykj1" style="width: 700px; max-width: 100%; height: 450px" allow="fullscreen" title="Arsip Digital"></iframe>
  </div>
</body>
</html>
